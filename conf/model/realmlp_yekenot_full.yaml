# RealMLP yekenot 완전복제 변형B = realmlp_yekenot + n_refit=1(B2, full-data 재학습).
# exp_046(아키텍처 6개만 차용, 옵티마이저는 TD 기본값)이 단일 0.9524로 top RealMLP(~0.9544) 대비
# −0.0016~0.002 저조했던 원인 = yekenot의 "튜닝된 레시피"(lr·스케줄·dropout·tfms·PLR·label
# smoothing·bias init·AUC 검증지표) 누락. 본 config 은 그 레시피 전체를 이식한다.
# ⚠️ random_state 는 train_realmlp.py 가 cfg.seed 로 주입 → 여기 두지 말 것(중복 kwarg 에러).
# 변형B 묶음: 피처=realmlp_yekenot_fe(B1 Driver-native + B3 heavy-FE) + 본 yaml n_refit=1(B2).
name: realmlp_yekenot_full
params:
  device: cuda            # Kaggle GPU(P100 기본 할당) — 노트북 cell2 가 P100 cu121 torch 처리
  n_cv: 1                 # 내부 CV 미사용 — exp_046 과 동일 fold 기준 비교
  n_refit: 1              # B2: 내부 CV 후 fold-train 전량 재학습(yekenot=full X_tr, +20% 데이터)
  verbosity: 1

  # --- yekenot 핵심 레시피 (TD 기본값 대비 오버라이드) ---
  val_metric_name: 1-auc_ovr   # 🔥 AUC 대회 → 내부 검증/스케줄을 AUC 로
  n_ens: 20
  n_epochs: 5                  # yekenot "싼 배깅"(짧게×많이) — lr/스케줄과 co-design
  batch_size: 256
  use_early_stopping: false
  early_stopping_additive_patience: 10
  early_stopping_multiplicative_patience: 1

  lr: 0.019                    # 🔥 TD 기본(~0.04)의 약 절반
  wd: 0.01
  sq_mom: 0.99
  lr_sched: lin_cos_log_15     # 🔥 스케줄 형태
  first_layer_lr_factor: 0.25

  embedding_size: 6
  max_one_hot_cat_size: 18
  hidden_sizes: [512, 256, 128]
  act: silu
  p_drop: 0.05                 # 🔥 TD 기본(~0.15)의 1/3 — 과소적합 방지
  p_drop_sched: invsqrtp1e-3

  plr_hidden_1: 16
  plr_hidden_2: 8
  plr_act_name: gelu
  plr_lr_factor: 0.1151
  plr_sigma: 2.33

  ls_eps: 0.01
  ls_eps_sched: sqrt_cos

  add_front_scale: false
  bias_init_mode: neg-uniform-dynamic-2
  tfms: [one_hot, median_center, robust_scale, smooth_clip, embedding, l2_normalize]
