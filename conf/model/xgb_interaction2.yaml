# [코어 분기 L4, gbdt.md] exp_073(3그룹) 완화판 = 2그룹(dynamics vs identity).
# 3그룹은 분기 강력(corr 0.964)이나 개별 폭락(0.946). dynamics(열화+레이스 통합)×identity 만 차단
# → 더 완화 → 개별↑ 회복하며 corr<0.97 유지 기대. sweet spot 탐색. 판정 = fold0 (개별, corr).
name: xgb
params:
  objective: binary:logistic
  eval_metric: auc
  tree_method: hist
  grow_policy: lossguide
  max_leaves: 63
  max_depth: 0
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  reg_lambda: 1.0
  interaction_constraints:
    - [TyreLife, Cumulative_Degradation, Stint, "LapTime (s)", LapTime_Delta, i_tyre_over_lapnum, i_laptime_x_deg, i_laptime_x_absdeg, i_laptime_over_absdeg, LapNumber, RaceProgress, Position, Position_Change, PitStop, i_lapnum_over_progress]
    - [Driver_freq, Race_Compound_freq, Race_Year_freq, Compound, Race, Year]
num_boost_round: 5000
early_stopping: 200
