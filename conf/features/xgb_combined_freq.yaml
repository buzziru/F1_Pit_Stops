# [GBDT decorrelation L1+i_*] XGB = i_* 상호작용(강도) + Driver freq-enc(decorrelation).
# exp_035(i_*+Driver TE, 동화 corr 0.9951)에서 Driver TE→freq 로 교체 = 강도 유지 + Driver 축 분기.
# 가설: 강한데 덜 중복 → 스택 기여 > L1(exp_041, freq만)·i_*(exp_035, 강도만). 판정=스택 swap+corr.
# native Driver·cross·Stint_cat drop, Driver_freq(numeric)로 대체.
feature_builder: add_xgb_decorr_features
target_encode_cols: []
target_encode_smoothing: 20.0
drop_cols: [Driver, Race_Compound, Race_Year, Stint_cat]
extra_categorical_cols: [Year, Stint]
