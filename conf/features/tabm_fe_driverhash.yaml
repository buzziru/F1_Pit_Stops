# TabM Phase 1 변형 (c) — Driver hashing 인코딩 (tabm_improvement_plan, 사용자 2026-06-05).
# exp_055 full-native에서 Driver native(887, sparse·약함)를 Driver_hash(887→64 native 버킷)로 교체.
# freq(1-D numeric, 약신호)와 달리 **native 임베딩 유지**하며 cardinality만 축소 → identity 일부 보존.
# TE 제외(분기 핵심) · 타깃 비의존 md5 안정 해시. 나머지(i_*·cross·Stint_cat·Year native) exp_055 동일.
# 빌더 add_driver_hash_features = add_realmlp_features + Driver_hash(int32, native로 사용).
# 게이트(fold0): corr<0.97 유지 + 개별 회복(vs exp_055 0.9436, freq exp_057). model=tabm 전용.
feature_builder: add_driver_hash_features
target_encode_cols: []
target_encode_smoothing: 20.0
drop_cols: [Driver]
extra_categorical_cols: [Year, Stint_cat, Race_Compound, Race_Year, Driver_hash]
