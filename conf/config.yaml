# Hydra 루트 설정 — 튜닝/실험 노브의 단일 진입점.
# 구조적 상수(경로·컬럼·CV·W&B project)는 src/config.py 유지.
defaults:
  - model: lgbm
  - features: base
  - _self_

exp_id: ???        # 필수 (CLI 로 지정: exp_id=exp_002)
notes: ""
use_wandb: true
max_folds: null    # null=전체 5-fold. N(>=1) 이면 동일 분할(seed/n_folds 불변)의 앞 N fold 만 실행(스크리닝용)
kill_criterion: "" # 스파이크 전 중단조건 선언(과몰입 구조적 가드, ADR #013). 예: "블렌드 기여<0.0005면 park". JSON 로그에 기록

# 외부 원본 데이터 train 증강 (검증/test 미포함). #8 참조.
augment:
  enabled: false   # true 면 fold 의 train 부분에만 원본 추가
  weight: 1.0      # 원본 행 sample weight (대회 행=1.0)

hydra:
  job:
    chdir: false   # cwd 변경 안 함 (src.config 절대경로 사용)
  run:
    dir: outputs/${exp_id}
  sweep:
    dir: outputs/multirun
    subdir: ${hydra.job.num}
